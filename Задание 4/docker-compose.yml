services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vicemods}
      POSTGRES_USER: ${POSTGRES_USER:-vicemods}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vicemods_local_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-vicemods}
      DATABASE_USERNAME: ${POSTGRES_USER:-vicemods}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-vicemods_local_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
